<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Thirst Wave | Homepage</title>
</head>
<body>
    <header>
        <div class="brand">
            <img src="logo.png" id="logo">
            <h1><a href="homepage.html" style="text-decoration: none; color: white">Thirst Wave</a></h1>
        </div>
        <nav>
            <a href="homepage.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="signup.html" id="sign-up">Sign Up</a>
        </nav>
    </header>
    <section class="hero">
        <div id="hero-text">
            <h1>Always Hydrated, Always Informed.</h1>
            <h4>Begin your journey of hydration with our water tracker reminder to ensure you're always one step ahead of the game. Treat your body with the care that it needs and deserves.</h4>
            <button id="enter" onclick="window.location.href='signup.html';">Start Today</button>
        </div>
        <!--Waves Container-->
        <div>
            <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
            </g>
            </svg>
        </div>
        <!--Waves end-->
    </section>
    <footer>
        <p>© 2026 Thirst Wave. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
