<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Thirst Wave | Login</title>
    <style>
        form {
                margin-left: 300px;
                margin-right: 300px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }
            label {
                text-align: left;
                padding-right: 10px;
                width: 65%;
            }
            input, select, option {
                border: 1px solid black;
                width: 65%;
                float: right;
                padding: 5px;
            }
            input[type="submit"] {
                background-color: lightgreen;
                border-radius: 25px;
                display: flex;
                flex-direction: row;
                width: 65%;
                border-radius: 25px;
                padding-left: 10px;
                padding-right: 10px;
                padding-bottom: 5px;
                padding-top: 5px;
                margin-bottom: 25px;
                gap: 10px;
                flex: 1;
            }
            input[type="submit"]:hover {
                background-color: darkolivegreen;
                color: white;
                box-shadow: 0 0 0 1px black;
            }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="logo.png" id="logo">
            <h1><a href="homepage.html" style="text-decoration: none; color: white">Thirst Wave</a></h1>
        </div>
        <nav>
            <a href="homepage.html">Home</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="signup.html" id="sign-up">Sign Up</a>
        </nav>
    </header>
    <section>
        <div class="entry-form">
            <h3>Login</h3>
            <form>
                <label for="username">Username *</label>
                <input type="text" id="username" name="Username" placeholder="CoolWater101" required><br>

                <label for="password">Password *</label>
                <input type="text" id="password" name="Password" placeholder="Password1234!" required><br>

                <input type="submit" value="Login">
            </form>
        </div>
        <!--Waves Container-->
        <div>
            <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
            </g>
            </svg>
        </div>
        <!--Waves end-->
    </section>
    <footer>
        <p>© 2026 Thirst Wave. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
